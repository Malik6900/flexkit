<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/flexkit.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/flexkit.js"></script>
  <title>FlexKit Framework</title>
  <style>
   
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center text-primary">Welcome to FlexKit</h1>

    <!-- Grid System Example -->
    <div class="row">
      <div class="col col-sm">Column 1</div>
      <div class="col col-sm">Column 2</div>
    </div>

    <!-- Date Picker Example -->
    <div class="date-picker">
      <input type="text" placeholder="Select a date" readonly>
      <div class="calendar">
        <div class="calendar-header">
          <select class="year-select"></select>
          <select class="month-select"></select>
        </div>
        <table>
          <thead>
            <tr>
              <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="calendar-controls">
          <button class="clear-btn">Clear</button>
          <button class="today-btn">Today</button>
          <button class="ok-btn">OK</button>
        </div>
      </div>
    </div>
  </div>

  
</body>
</html>
